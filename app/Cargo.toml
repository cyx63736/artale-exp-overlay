[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Security"] }
ocr = { path = "../ocr" }
reader = { path = "../reader" }
tracker = { path = "../tracker" }
image = { version = "0.25", default-features = false, features = ["png"] }
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "links"] }
winit = "0.30"
softbuffer = "0.4"
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
